
apiVersion: apps/v1
kind: Deployment
metadata:
  name: three
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ola
  template:
    metadata:
      labels:
        app: ola
    spec:
      containers:
      - name: cont-1
        image: shaikmustafa/mygame
        ports:
        - containerPort: 80
        env:
        - name: TITLE
          value: "NGINX APP1"
---
apiVersion: v1
kind: Service
metadata:
  name: svc3
spec:
  type: ClusterIP
  ports:
  - port: 80
  selector:
    app: ola
