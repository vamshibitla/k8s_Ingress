apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /vamsi
        pathType: Prefix
        backend:
          service:
            name: svc1
            port:
              number: 80
      - path: /mustafa
        pathType: Prefix
        backend:
          service:
            name: svc2
            port:
              number: 80
      - path: /sai
        pathType: Prefix
        backend:
          service:
            name: svc3
            port:
              number: 80
